{% extends "base.html" %}{% block title %}Publish a recipe — Flavour Fusion{% endblock %}{% block content %}<section class="form-page"><a class="back-link" href="{{ url_for('home') }}">← Back to explore</a><div class="eyebrow">SHARE SOMETHING GOOD</div><h1>Put your recipe <em>on the table.</em></h1><p class="muted">Your favourite dishes deserve to be shared. Add clear ingredients and simple steps.</p><form method="post" class="publish-form"><div class="form-grid"><label>Recipe title<input name="title" required maxlength="120" placeholder="e.g. Sunday lemon cake"></label><label>Cuisine<input name="cuisine" required placeholder="e.g. Indian, Italian, Fusion"></label><label>Difficulty<select name="difficulty"><option>Easy</option><option>Medium</option><option>Advanced</option></select></label><label>Dietary category<select name="diet"><option value="vegetarian">Vegetarian</option><option value="vegan">Vegan</option><option value="gluten-free">Gluten-free</option><option value="contains meat">Contains meat</option><option value="any">Any</option></select></label><label>Cooking time (minutes)<input name="minutes" type="number" min="1" max="1440" value="30" required></label><label>Servings<input name="servings" type="number" min="1" max="50" value="2" required></label></div><label>Short description<textarea name="description" required rows="2" placeholder="What makes this dish special?"></textarea></label><label>Ingredients <small>Separate each ingredient with a comma</small><textarea name="ingredients" required rows="3" placeholder="2 tomatoes, 1 onion, 1 tbsp olive oil..."></textarea></label><label>Instructions <small>Write clear steps, separated by sentences or numbered steps.</small><textarea name="instructions" required rows="6" placeholder="1. Prepare the ingredients. 2. Heat the pan..."></textarea></label><button class="btn btn-dark" type="submit">Publish recipe ↗</button></form></section>{% endblock %}
